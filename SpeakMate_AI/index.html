<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpeakMate AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2B29;--paper:#F5F2EC;--panel:#FFF;--sage:#3E6259;--sage-dim:#5B7C72;--amber:#D98A2B;--amber-soft:#F3DDB8;--line:#DCD5C6;--err:#B4483B;--radius:14px}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif;line-height:1.5}h1,h2,h3{font-family:Fraunces,serif;font-weight:500;letter-spacing:-.01em}button{font-family:inherit;cursor:pointer}
#app{max-width:720px;margin:auto;min-height:100vh;display:flex;flex-direction:column}.screen{padding:36px 24px 48px;flex:1;display:flex;flex-direction:column}
.top-nav{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 0}.logo{font-family:Fraunces,serif;font-weight:600;font-size:16px}.link-btn,.btn-ghost{background:none;color:var(--sage-dim);text-decoration:underline;text-underline-offset:3px;border:0;font-size:13px}
.btn-primary{background:var(--sage);color:#fff;border:0;padding:14px 28px;border-radius:999px;font-size:15px;font-weight:600}.btn-primary:hover{background:#324f47}.btn-primary:disabled{opacity:.5;cursor:not-allowed}.btn-secondary{background:transparent;color:var(--sage);padding:12px 24px;border-radius:999px;font-size:14px;font-weight:600;border:1.5px solid var(--sage)}
.hero{padding-top:12px}.kicker{color:var(--amber);font-size:13px;font-weight:600;margin-bottom:8px}.hero h1{font-size:44px;margin:0 0 6px;line-height:1.05}.hero .sub{font-size:19px;color:var(--sage);margin:0 0 18px;font-family:Fraunces,serif}.lede{font-size:16px;color:#4A4F49;max-width:52ch;margin:0 0 28px}
.steps{display:flex;flex-direction:column;gap:14px;margin:8px 0 32px;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}.step{display:flex;gap:14px;align-items:flex-start}.step .n{width:26px;height:26px;border-radius:50%;background:var(--amber-soft);color:#7A4E10;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}.disclosure{font-size:13px;color:#6B7268;border-top:1px solid var(--line);padding-top:16px;margin-top:8px}
.option-block{margin:0 0 16px}.option-label{font-weight:600;font-size:14px;margin-bottom:8px}.option-sub{font-size:12.5px;color:#7A8177;max-width:44ch;margin-top:2px}.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}.switch{width:44px;height:26px;border-radius:999px;background:#DCD5C6;border:0;position:relative;flex-shrink:0;padding:0;transition:background .2s}.switch.on{background:var(--sage)}.switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}.switch.on .knob{left:21px}
.scenario-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.scenario-card{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;text-align:left}.scenario-card:hover{border-color:var(--sage);transform:translateY(-2px)}.scenario-card .emoji{font-size:26px}.scenario-card h3{font-size:17px;margin:8px 0 4px}.scenario-card p{font-size:13.5px;color:#666B62;margin:0}
.convo-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.avatar-wrap{display:flex;align-items:center;gap:14px}.avatar{width:56px;height:56px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center;font-size:26px;transition:.25s;flex-shrink:0}.avatar.listening{box-shadow:0 0 0 6px rgba(62,98,89,.15)}.avatar.thinking{animation:pulse 1.1s ease-in-out infinite}.avatar.speaking{box-shadow:0 0 0 6px rgba(217,138,43,.18)}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.avatar-meta .name{font-weight:600;font-size:15px}.avatar-meta .status{font-size:12.5px;color:var(--sage-dim)}.progress{font-size:12.5px;color:#7A8177;font-weight:600}
.transcript{flex:1;display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding:4px 2px 16px;min-height:260px}.bubble{max-width:82%;padding:12px 16px;border-radius:16px;font-size:15px;overflow-wrap:anywhere}.bubble.ai{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}.bubble.user{background:var(--sage);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}.thinking-dots{background:var(--panel);border:1px solid var(--line);align-self:flex-start;color:#8B9187}.composer{border-top:1px solid var(--line);padding-top:14px;margin-top:8px}.composer-row{display:flex;gap:8px;align-items:center}.composer textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:15px Inter,sans-serif;background:var(--panel);color:var(--ink);min-width:0}.composer textarea:focus{outline:none;border-color:var(--sage)}.mic-btn{width:46px;height:46px;border-radius:50%;background:var(--amber-soft);color:#7A4E10;font-size:19px;border:0;flex-shrink:0}.mic-btn.recording{background:var(--err);color:#fff}.composer-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}.hint{font-size:12px;color:#8B9187}.demo-banner{background:#FBF0D9;border:1px solid var(--amber-soft);color:#7A4E10;font-size:12.5px;padding:8px 14px;border-radius:10px;margin-bottom:16px}
.fb-hero{text-align:center;padding:8px 0 20px}.fb-hero h1{font-size:30px;margin:6px 0 4px}.score-ring{font-size:40px;font-weight:700;color:var(--sage);font-family:Fraunces,serif}.metrics,.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.metric,.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.metric .label,.stat .lbl{font-size:12.5px;color:#7A8177;margin-bottom:4px}.metric .val{font-size:20px;font-weight:700;font-family:Fraunces,serif}.metric .bar{height:5px;background:#EAE5D8;border-radius:3px;margin-top:8px;overflow:hidden}.metric .bar-fill{height:100%;background:var(--sage)}.fb-block{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:12px}.fb-block h3{font-size:14px;margin:0 0 6px;color:var(--sage)}.fb-block p{margin:0;font-size:15px}.basis-note{font-size:11.5px;color:#9A9186;margin-top:20px}
.fb-list{margin:0;padding-left:18px;font-size:15px}.fb-list li{margin-bottom:4px}
.fb-details{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin-bottom:12px;overflow:hidden}.fb-details summary{cursor:pointer;padding:14px 18px;font-weight:600;font-size:14px;color:var(--sage);list-style:none}.fb-details summary::-webkit-details-marker{display:none}.fb-details summary::after{content:'▸';float:right;color:#9A9186;transition:transform .15s}.fb-details[open] summary::after{transform:rotate(90deg)}.fb-details-body{padding:0 18px 16px;display:flex;flex-direction:column;gap:10px}
.correction-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.corr-row{display:flex;gap:8px;align-items:baseline;font-size:14px;margin-bottom:4px}.corr-tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:999px;flex-shrink:0}.corr-tag.orig{background:#F3E4E0;color:var(--err)}.corr-tag.imp{background:#E9EFEC;color:var(--sage)}.corr-expl{margin:6px 0 0;font-size:12.5px;color:#7A8177}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}.chip{background:#E9EFEC;color:var(--sage);font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px}
.stars{display:flex;gap:6px;font-size:30px;margin:10px 0 20px}.stars span{cursor:pointer;opacity:.3}.stars span.active{opacity:1}.radio-row{display:flex;gap:10px;margin:8px 0 20px}.radio-row button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);font-weight:600;font-size:14px}.radio-row button.sel{border-color:var(--sage);background:#E9EFEC;color:var(--sage)}textarea.survey-box{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;font:14px Inter,sans-serif;min-height:70px;margin-bottom:20px}
.stat .num{font-size:26px;font-weight:700;font-family:Fraunces,serif;color:var(--sage)}.scenario-stats{margin-top:20px}.scenario-stat{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
@media(max-width:520px){.scenario-grid{grid-template-columns:1fr}.hero h1{font-size:38px}.composer-row{align-items:stretch}.composer-row .btn-primary{padding:11px 15px}.mic-btn{width:44px;height:44px}.bubble{max-width:90%}.screen{padding-left:18px;padding-right:18px}.top-nav{padding-left:18px;padding-right:18px}}
</style>
</head>
<body><div id="app"></div>
<script>
const SCENARIOS=[
{id:'casual',emoji:'💬',title:'Casual Conversation',desc:'Talk about everyday life, like chatting with a friend.',opener:"Hi! I'm Maya. So, tell me — how has your day been going?",context:"You are Maya, chatting casually with the learner like a friend, about everyday life and how their day is going.",demoTurns:["That's great! What was the best part of it?","Nice — do you usually spend your evenings like that, or was today different?","What are you looking forward to this week?","Sounds fun! Anything you're a little nervous about too?"]},
{id:'interview',emoji:'💼',title:'Job Interview',desc:'Practice answering common interview questions with confidence.',opener:"Hello, thanks for coming in today. To start — could you tell me a bit about yourself?",context:"You are Maya, a warm and encouraging interviewer, helping the learner rehearse answering common job-interview questions in a low-pressure way.",demoTurns:["Thanks for sharing that. What would you say is your biggest strength?","Can you describe a challenge you faced and how you handled it?","Why are you interested in this kind of role?","Where do you see yourself in a few years?"]},
{id:'discussion',emoji:'🎓',title:'Group Discussion',desc:'Practice sharing opinions on a discussion topic.',opener:"Let's dig into a topic together: do you think social media has a positive or negative impact on students?",context:"You are Maya, a curious discussion partner exploring the learner's opinions, currently discussing whether social media helps or hurts students.",demoTurns:["Interesting take. What about the flip side — do you see any downsides too?","Do you think schools should teach students how to use it responsibly?","Has your own use of social media changed over time?","What's one rule you'd set for yourself around it?"]},
{id:'travel',emoji:'✈️',title:'Travel',desc:'Practice a real travel scenario, like checking into a hotel.',opener:"Welcome! I'm at the front desk. How can I help you check in today?",context:"You are Maya, hotel front-desk staff helping the learner check in, staying in role for a natural travel situation.",demoTurns:["Of course. Could I get your name for the reservation?","Perfect, I found it. Would you like a room with a city view or a garden view?","Will you need any help with luggage or directions to your room?","Wonderful — is there anything else I can help you with?"]},
{id:'dailylife',emoji:'🏡',title:'Daily Life',desc:'Chat about routines, hobbies, and everyday moments.',opener:"Hey! What does a normal day look like for you these days?",context:"You are Maya, a friendly conversation partner talking with the learner about their daily routine, hobbies, and everyday life.",demoTurns:["That sounds nice! What's usually the best part of your day?","Do you have any hobbies you try to make time for?","What do you usually do to relax in the evening?","Is there anything you'd like to change about your daily routine?"]},
{id:'college',emoji:'🎒',title:'College',desc:'Talk about classes, campus life, and student experiences.',opener:"Hi! So what are you studying right now, and how's it going?",context:"You are Maya, chatting with the learner about their studies, classes, and campus life, like a friendly classmate.",demoTurns:["Nice! What's your favorite subject so far?","How are you finding the workload — manageable or a bit much?","Do you spend more time studying alone or with friends?","Any plans for after you finish your studies?"]},
{id:'shopping',emoji:'🛍️',title:'Shopping',desc:'Practice everyday conversations at a shop or market.',opener:"Welcome in! Are you looking for anything in particular today?",context:"You are Maya, a friendly shop assistant helping the learner with a shopping conversation — stay in role and keep it natural.",demoTurns:["Great choice! Do you know what size you're looking for?","We actually have a similar item in a different color — want to see it?","Would you like me to check if we have that in stock?","Anything else I can help you find today?"]},
{id:'social',emoji:'🎉',title:'Social Conversation',desc:'Practice small talk at a party, gathering, or with new people.',opener:"Hi there! I don't think we've met yet — how do you know people here?",context:"You are Maya, someone the learner is meeting at a social gathering, making warm, friendly small talk and getting to know them.",demoTurns:["Nice to meet you! What brought you here tonight?","That's fun — how long have you been doing that?","Do you usually enjoy events like this?","What do you like to do when you're not busy with that?"]},
{id:'workplace',emoji:'🏢',title:'Workplace',desc:'Practice everyday conversations with a colleague at work.',opener:"Morning! Do you have a few minutes to chat about the new project?",context:"You are Maya, a friendly colleague chatting with the learner about everyday workplace topics — warm and natural, not formal.",demoTurns:["Sounds good. What part of the project are you focused on?","How's the timeline looking on your end?","Is there anything blocking you at the moment?","Let's catch up again soon — anything else on your mind?"]}
];
const MAX_TURNS=5;

const DIFFICULTY_LABELS={beginner:'Beginner',intermediate:'Intermediate',advanced:'Advanced'};
const DIFFICULTY_PROMPTS={
  beginner:"The learner is a BEGINNER. Use simple, common, everyday vocabulary and short sentences. Ask one gentle follow-up question at a time. Avoid idioms, phrasal verbs, or advanced expressions. Keep your own reply to one short, simple sentence plus a simple question.",
  intermediate:"The learner is at an INTERMEDIATE level. Use natural, everyday conversational English with a moderate vocabulary range. Encourage longer, more detailed responses. Keep your own reply to 1-2 natural sentences.",
  advanced:"The learner is ADVANCED. Use natural expressions and idioms where they fit naturally. Ask more complex, open-ended questions that invite detailed, nuanced responses. Keep your own reply to 1-2 sentences, but you may use richer vocabulary."
};
function buildSystemPrompt(scenario,difficulty,englishOnly){
  const parts=[
    "You are Maya, a warm, encouraging AI English-speaking partner — not a strict teacher. Your goal is to keep a natural, flowing conversation going so the learner gets to speak as much as possible.",
    scenario.context,
    DIFFICULTY_PROMPTS[difficulty]||DIFFICULTY_PROMPTS.intermediate,
    "Ask only one question at a time. Never correct grammar mid-conversation — that happens later, after the session. Look back at the conversation so far so you don't repeat a question you've already asked, and build naturally on what the learner already told you. Keep your own replies short (1-2 sentences) so the learner does most of the talking."
  ];
  if(englishOnly){
    parts.push("English Only Mode is ON: always reply in English yourself. If the learner writes in another language, respond warmly, briefly and encouragingly, gently inviting them to try it in English — never shame, scold, or lecture them — then continue the conversation naturally.");
  }
  return parts.join('\n\n');
}

// Calibrates the post-session feedback prompt to the learner's chosen
// difficulty, so a Beginner isn't penalized for simplicity and an Advanced
// learner gets held to a higher, more nuanced standard.
const DIFFICULTY_FEEDBACK_NOTE={
  beginner:"The learner chose Beginner difficulty. Do not penalize simple vocabulary or short, simple sentences — that is appropriate at this level. Prioritize encouragement and basic correctness over sophistication.",
  intermediate:"The learner chose Intermediate difficulty. Expect natural, moderately varied everyday English. Balance feedback between correctness and natural flow.",
  advanced:"The learner chose Advanced difficulty. Give more detailed feedback on vocabulary variety, sentence sophistication, natural/idiomatic expression, precision, and nuance — hold this session to a higher standard than Beginner or Intermediate."
};
// Light, shared per-scenario focus notes so the feedback is scenario-relevant
// without building a separate feedback system for every scenario.
const SCENARIO_FEEDBACK_FOCUS={
  casual:"natural conversational English, easy follow-up responses, and everyday expressions",
  interview:"clearly explaining experience and answering questions directly, while sounding natural rather than overly rehearsed",
  discussion:"expressing and explaining opinions, agreeing or disagreeing politely, and clarity of reasoning",
  travel:"practical, polite, and clearly understandable requests",
  dailylife:"natural, everyday description of routines and daily life",
  college:"everyday academic communication — explaining ideas and asking questions clearly",
  shopping:"clear, polite requests and practical back-and-forth",
  social:"natural small talk and warm, easy conversational flow",
  workplace:"professional but natural English — clear and concise communication"
};

let state={view:'landing',scenario:null,difficulty:'intermediate',englishOnly:false,transcript:[],turn:0,avatarState:'idle',demoMode:false,loading:false,feedback:null,survey:{stars:0,again:null,comment:''},recording:false,inputText:'',sessionId:null,completed:false,submitted:false};
let recognition=null;
let recognitionSupported=false;
try{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    recognition=new SR();
    recognition.continuous=false;
    recognition.interimResults=true;
    recognition.lang='en-IN';
    recognition.maxAlternatives=1;
    recognitionSupported=true;
  }
}catch(e){
  recognition=null;
  recognitionSupported=false;
}
const app=document.getElementById('app');
const anonKey='speakmate_anon_id';
function newId(){try{return crypto.randomUUID()}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2)}}
function anonId(){try{let x=localStorage.getItem(anonKey);if(!x){x='anon_'+newId();localStorage.setItem(anonKey,x)}return x}catch(e){return 'anon_session'}}
const anonymousUserId=anonId();
let renderedView=null;

function event(name,meta={}){fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event_name:name,session_id:meta.sessionId||state.sessionId,scenario:meta.scenario||state.scenario?.id||null,metadata:{...meta,anonymousUserId}})}).catch(()=>{})}
function render(){ROUTES[state.view]()}
const ROUTES={landing:renderLanding,scenario:renderScenario,conversation:renderConversation,feedback:renderFeedback,survey:renderSurvey,analytics:renderAnalytics,thanks:renderThanks};

function nav(){return `<div class="top-nav"><div class="logo">SpeakMate AI</div><button class="link-btn" onclick="goAnalytics()">Product Pulse</button></div>`}
function renderLanding(){if(renderedView!=='landing'){event('landing_viewed');renderedView='landing'}app.innerHTML=nav()+`<div class="screen hero"><div class="kicker">AI speaking practice</div><h1>Practice real conversations.</h1><div class="sub">Speak with confidence.</div><p class="lede">Practice English through short conversations with an AI speaking partner, Maya. Choose a situation, start talking, and get personalized feedback after every session.</p><button class="btn-primary" onclick="goScenario()">Start Practicing</button><button class="btn-ghost" style="margin-top:10px" onclick="testMayaVoice()">🔊 Test Maya Voice</button><div class="steps"><div class="step"><div class="n">1</div><div>Choose a real-life situation to practice.</div></div><div class="step"><div class="n">2</div><div>Talk with Maya by voice or text.</div></div><div class="step"><div class="n">3</div><div>Get concise feedback and decide whether to practice again.</div></div></div><div class="disclosure">You'll be practicing with an AI conversation partner, not a human. Scores are based on transcript patterns, not pronunciation or accent.</div></div>`}
function goScenario(){state.view='scenario';render()}
async function goAnalytics(){state.view='analytics';render()}
function renderScenario(){if(renderedView!=='scenario'){event('scenario_view');renderedView='scenario'}app.innerHTML=nav()+`<div class="screen"><h2 style="font-size:24px;margin:0 0 4px">Choose a situation</h2><p style="color:#666B62;font-size:14.5px;margin:0 0 18px">Pick the kind of conversation you want to practice.</p><div class="option-block"><div class="option-label">Difficulty</div><div class="radio-row">${Object.keys(DIFFICULTY_LABELS).map(d=>`<button class="${state.difficulty===d?'sel':''}" onclick="setDifficulty('${d}')">${DIFFICULTY_LABELS[d]}</button>`).join('')}</div></div><div class="option-block toggle-row"><div><div class="option-label">English Only Mode</div><div class="option-sub">Maya replies in English and gently encourages you back to English if needed — no pressure.</div></div><button class="switch ${state.englishOnly?'on':''}" onclick="toggleEnglishOnly()" aria-pressed="${state.englishOnly}" aria-label="Toggle English Only Mode"><span class="knob"></span></button></div><div class="scenario-grid">${SCENARIOS.map(s=>`<button class="scenario-card" onclick="startScenario('${s.id}')"><div class="emoji">${s.emoji}</div><h3>${s.title}</h3><p>${s.desc}</p></button>`).join('')}</div></div>`}
function setDifficulty(d){state.difficulty=d;render()}
function toggleEnglishOnly(){state.englishOnly=!state.englishOnly;render()}
function startScenario(id){const s=SCENARIOS.find(x=>x.id===id);state={...state,scenario:s,transcript:[{role:'ai',text:s.opener}],turn:0,avatarState:'idle',demoMode:false,loading:false,feedback:null,survey:{stars:0,again:null,comment:''},recording:false,inputText:'',sessionId:'sess_'+newId(),completed:false,submitted:false};event('scenario_selected',{scenario:id,sessionId:state.sessionId,difficulty:state.difficulty,englishOnly:state.englishOnly});event('session_started',{scenario:id,sessionId:state.sessionId,difficulty:state.difficulty,englishOnly:state.englishOnly});state.view='conversation';render();speakMaya(s.opener);}
function renderConversation(){const s=state.scenario;app.innerHTML=`<div class="screen"><div class="convo-header"><div class="avatar-wrap"><div class="avatar ${state.avatarState}">${avatarEmoji()}</div><div class="avatar-meta"><div class="name">Maya — AI Speaking Partner</div><div class="status">${statusLabel()}</div></div></div><div class="progress">${DIFFICULTY_LABELS[state.difficulty]||'Intermediate'}${state.englishOnly?' · English Only':''} · Turn ${Math.min(state.turn+1,MAX_TURNS)} / ${MAX_TURNS}</div></div>${state.demoMode?`<div class="demo-banner">Demo Mode — AI responses are simulated for this conversation.</div>`:''}<div class="transcript" id="transcript">${state.transcript.map(t=>`<div class="bubble ${t.role==='ai'?'ai':'user'}">${escapeHtml(t.text)}</div>`).join('')}${state.loading?`<div class="bubble thinking-dots">Maya is thinking…</div>`:''}</div><div class="composer"><div class="composer-row"><textarea id="inputBox" rows="1" placeholder="Type your response…" ${state.loading?'disabled':''} oninput="state.inputText=this.value"></textarea><button class="mic-btn ${state.recording?'recording':''}" onclick="toggleMic()" ${state.loading?'disabled':''}>${state.recording?'⏹':'🎤'}</button><button class="btn-primary" onclick="sendResponse()" ${state.loading?'disabled':''}>Send</button></div><div class="composer-foot"><div class="hint">${recognitionSupported?'Tap 🎤 to speak, or type instead.':'Microphone unavailable in this browser — type your response instead.'}</div><button class="end-link btn-ghost" onclick="endSessionEarly()">End session</button></div></div></div>`;const t=document.getElementById('transcript');if(t)t.scrollTop=t.scrollHeight;const b=document.getElementById('inputBox');if(b){b.value=state.inputText;b.focus()}}
function avatarEmoji(){return state.avatarState==='listening'?'👂':state.avatarState==='thinking'?'🤔':state.avatarState==='speaking'?'🗣️':'🙂'}
function statusLabel(){return state.avatarState==='listening'?'Listening…':state.avatarState==='thinking'?'Thinking…':state.avatarState==='speaking'?'Speaking…':'Ready when you are'}
function toggleMic() {
  if (!recognitionSupported || !recognition) {
    alert("Voice input is not supported in this browser. Please use Google Chrome.");
    return;
  }

  if (state.recording) {
    try {
      recognition.stop();
    } catch (e) {}

    state.recording = false;
    state.avatarState = 'idle';
    render();
    return;
  }

  state.recording = true;
  state.avatarState = 'listening';
  render();

  recognition.onstart = () => {
    console.log("Speech recognition started");
    state.recording = true;
    state.avatarState = 'listening';
    render();
  };

  recognition.onresult = (event) => {
    let transcript = '';

    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }

    transcript = transcript.trim();

    if (transcript) {
      console.log("Speech detected:", transcript);

      state.inputText = transcript;

      state.recording = false;
      state.avatarState = 'idle';

      render();
    }
  };

  recognition.onerror = (event) => {
    console.warn("Speech recognition error:", event.error);

    state.recording = false;
    state.avatarState = 'idle';
    render();

    if (event.error === 'no-speech') {
      console.log("No speech detected. Please try speaking closer to the microphone.");
    } else if (event.error === 'not-allowed') {
      alert("Microphone permission was denied. Please allow microphone access in Chrome.");
    } else if (event.error === 'audio-capture') {
      alert("Chrome could not access your microphone. Please check your microphone device.");
    }
  };

  recognition.onend = () => {
    console.log("Speech recognition ended");

    state.recording = false;
    state.avatarState = 'idle';
    render();
  };

  try {
    recognition.start();
    console.log("Starting microphone...");
  } catch (error) {
    console.warn("Could not start speech recognition:", error);

    state.recording = false;
    state.avatarState = 'idle';
    render();
  }
}

function speakMaya(text){
  if(!text||!('speechSynthesis' in window))return Promise.resolve(false);

  return new Promise(resolve=>{
    try{
      window.speechSynthesis.cancel();

      const utterance=new SpeechSynthesisUtterance(String(text));
      utterance.lang='en-US';
      utterance.rate=0.92;
      utterance.pitch=1.0;
      utterance.volume=1.0;

      let spoken=false; // guards against speak() firing twice when no en-* voice is found
      const chooseVoice=()=>{
        if(spoken)return;
        spoken=true;

        const voices=window.speechSynthesis.getVoices();
        const voice=voices.find(v=>/^en(-|_)(US|GB)/i.test(v.lang))
          || voices.find(v=>/^en/i.test(v.lang));
        if(voice) utterance.voice=voice;

        state.avatarState='speaking';
        render();

        utterance.onend=()=>{
          state.avatarState='idle';
          render();
          resolve(true);
        };
        utterance.onerror=(e)=>{
          console.warn('Speech synthesis error:',e);
          state.avatarState='idle';
          render();
          resolve(false);
        };

        window.speechSynthesis.resume();
        window.speechSynthesis.speak(utterance);
      };

      // Chrome may load voices asynchronously.
      if(window.speechSynthesis.getVoices().length){
        chooseVoice();
      }else{
        const once=()=>{
          window.speechSynthesis.removeEventListener('voiceschanged',once);
          chooseVoice();
        };
        window.speechSynthesis.addEventListener('voiceschanged',once);
        setTimeout(()=>{
          window.speechSynthesis.removeEventListener('voiceschanged',once);
          chooseVoice();
        },800);
      }
    }catch(e){
      console.warn('Speech synthesis start error:',e);
      state.avatarState='idle';
      render();
      resolve(false);
    }
  });
}

async function sendResponse(){const text=(state.inputText||'').trim();if(!text||state.loading||state.completed)return;state.transcript.push({role:'user',text});event('user_response',{scenario:state.scenario.id,sessionId:state.sessionId,turn:state.turn+1,difficulty:state.difficulty,englishOnly:state.englishOnly});state.inputText='';state.turn++;state.loading=true;state.avatarState='thinking';render();if(state.turn>=MAX_TURNS){await finishSession();return}try{let reply;if(state.demoMode){await sleep(550);reply=state.scenario.demoTurns[(state.turn-1)%state.scenario.demoTurns.length]}else{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:buildSystemPrompt(state.scenario,state.difficulty,state.englishOnly),messages:state.transcript.map(t=>({role:t.role==='ai'?'assistant':'user',content:t.text}))})});if(!r.ok)throw new Error('AI unavailable');reply=(await r.json()).reply}state.transcript.push({role:'ai',text:reply});event('avatar_interaction',{scenario:state.scenario.id,sessionId:state.sessionId,turn:state.turn});state.loading=false;render();await speakMaya(reply)}catch(e){state.demoMode=true;await sleep(350);const reply=state.scenario.demoTurns[(state.turn-1)%state.scenario.demoTurns.length];state.transcript.push({role:'ai',text:reply});event('avatar_interaction',{scenario:state.scenario.id,sessionId:state.sessionId,turn:state.turn,demo:true});state.loading=false;render();await speakMaya(reply)}state.avatarState='idle';render()}
async function endSessionEarly(){if(state.loading)return;try{if('speechSynthesis' in window)window.speechSynthesis.cancel()}catch(e){}try{if(state.recording&&recognition)recognition.stop()}catch(e){}state.recording=false;event('session_abandoned',{scenario:state.scenario?.id,sessionId:state.sessionId,turns:state.turn});state.view='scenario';render()}
async function finishSession(){
  if(state.completed)return;

  state.completed=true;

  event('session_completed',{
    scenario:state.scenario.id,
    sessionId:state.sessionId,
    turns:state.turn,
    difficulty:state.difficulty,
    englishOnly:state.englishOnly
  });

  state.loading=true;
  state.avatarState='thinking';
  render();

  let fb=null;

  // Collect only the user's actual responses
  const userResponses=state.transcript
    .filter(t=>t.role==='user')
    .map((t,i)=>`Response ${i+1}: ${t.text}`)
    .join('\n');

  try{
    const scenarioFocus=SCENARIO_FEEDBACK_FOCUS[state.scenario.id]||"natural, clear spoken English for this situation";
    const difficultyNote=DIFFICULTY_FEEDBACK_NOTE[state.difficulty]||DIFFICULTY_FEEDBACK_NOTE.intermediate;
    const englishOnlyLine=state.englishOnly?`\n- English Only Mode was active during this session, so the learner was encouraged to respond in English throughout.`:'';

    const feedbackSystem=`
You are an expert but encouraging English-speaking coach analyzing a learner's practice conversation.

This is spoken-English practice feedback, NOT a job-interview evaluation, resume review, or hiring assessment — even if the scenario was a job-interview role-play, judge only their English communication, never their interview performance, professionalism, or suitability for a role.

SESSION CONTEXT:
- Scenario: ${state.scenario.title} — pay particular attention to ${scenarioFocus}.
- ${difficultyNote}${englishOnlyLine}

Analyze ONLY the learner's actual responses below. Every score, mistake, pattern, and example must be grounded in what they actually wrote.

CRITICAL RULES — READ CAREFULLY:
- Do NOT invent mistakes. If a genuine grammar mistake is not present, "grammar.mistakes" MUST be an empty array [].
- Never quote the learner as having said something they did not say.
- Do NOT punish informal, conversational English (contractions, casual phrasing, short natural replies) — that is normal spoken English, not an error.
- Only include a vocabulary suggestion when a genuinely better, context-appropriate alternative exists — do not replace already-good word choices just to fill the list.
- Only note a grammar "pattern" if the same type of mistake genuinely repeats more than once in the transcript.
- For "confidence", use ONLY observable indicators from the transcript: response length, hesitation markers/filler words, repetition, and willingness to elaborate. NEVER make psychological, medical, or personality claims about the learner.
- Keep every list to a MAXIMUM of 3 items. Fewer, or empty, is correct when there isn't enough genuine material — never pad lists with invented or generic content.
- Keep tone constructive, specific, and warm throughout — this is a supportive practice partner, not a strict examiner.

SCORING — integers from 0 to 100 for each:
- fluency: how naturally and continuously ideas flow, including repetition and filler-word use
- grammar: accuracy of sentence construction, tense, articles, prepositions, subject-verb agreement, etc.
- vocabulary: range, appropriateness, and variety of vocabulary for the context
- clarity: how understandable and well-structured the responses are
- confidence: based only on observable indicators above — not a psychological measurement
These scores are an AI-generated practice indicator, not a scientifically validated measurement. Justify each score by what's actually in the transcript.

Return ONLY valid JSON in exactly this structure:

{
  "overall_summary": "One or two sentence summary of the learner's speaking performance this session, referencing something specific they actually said.",
  "scores": {"fluency":0,"grammar":0,"vocabulary":0,"clarity":0,"confidence":0},
  "strengths": ["Specific, evidence-based strength."],
  "grammar": {
    "mistakes": [{"original":"exact words the learner used","correction":"corrected version","explanation":"brief, simple reason"}],
    "patterns": ["A grammar pattern that genuinely repeated more than once, if any."]
  },
  "vocabulary": {
    "used_well": ["A word or phrase the learner used effectively, if any."],
    "suggestions": [{"basic":"a word/phrase the learner used","better":"a stronger, context-appropriate alternative","example":"a short example sentence using the better word"}]
  },
  "fluency": {"assessment":"Short, specific assessment.","issues":["A genuine fluency issue, if any."],"tips":["A practical tip."]},
  "clarity": {"assessment":"Short, specific assessment.","tips":["A practical tip."]},
  "confidence": {"assessment":"Short, specific assessment based only on observable indicators.","tips":["A practical tip."]},
  "practice_plan": ["One specific, personalized practice recommendation."]
}
`;

    const r=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        system:feedbackSystem,
        messages:[
          {
            role:'user',
            content:
              `Here are the learner's actual responses:\n\n${userResponses}\n\nAnalyze these responses and return the requested JSON.`
          }
        ],
        jsonMode:true
      })
    });

    if(!r.ok){
      throw new Error(`Feedback API returned ${r.status}`);
    }

    const data=await r.json();

    console.log('Raw feedback response:',data.reply);

    const cleaned=String(data.reply||'')
      .replace(/```json/gi,'')
      .replace(/```/g,'')
      .trim();

    fb=sanitizeFeedback(JSON.parse(cleaned));

  }catch(e){
    console.error('Feedback generation failed:',e);

    // Do NOT silently show fake fixed feedback.
    fb=null;
  }

  if(fb){

    fb.overall=Math.round(
      (
        fb.scores.fluency+
        fb.scores.grammar+
        fb.scores.vocabulary+
        fb.scores.clarity+
        fb.scores.confidence
      )/5
    );

  }else{

    // A dynamic fallback based on the user's actual transcript.
    // This is NOT presented as AI-generated feedback, and it NEVER invents
    // specific grammar mistakes, patterns, or vocabulary suggestions — only
    // aggregate, honest observations from response length and count.
    const responseCount=state.transcript.filter(t=>t.role==='user').length;
    const wordCount=userResponses.trim()
      ? userResponses.trim().split(/\s+/).length
      : 0;

    const avgWords=responseCount
      ? Math.round(wordCount/responseCount)
      : 0;

    const short=avgWords<8;

    fb={
      overall_summary:
        `You completed ${responseCount} response${responseCount===1?'':'s'} in this ${DIFFICULTY_LABELS[state.difficulty]||'Intermediate'}-level ${state.scenario.title} conversation. Live AI analysis wasn't available this session, so this is a simulated summary based on response length only.`,
      scores:{
        fluency:short?50:avgWords>=12?70:60,
        grammar:60,
        vocabulary:avgWords>=15?70:60,
        clarity:avgWords>=8?70:60,
        confidence:short?50:avgWords>=12?70:60
      },
      strengths:[
        `You completed ${responseCount} response${responseCount===1?'':'s'} and kept the conversation going.`
      ],
      grammar:{mistakes:[],patterns:[]},
      vocabulary:{used_well:[],suggestions:[]},
      fluency:{
        assessment:`Your responses averaged around ${avgWords} word${avgWords===1?'':'s'} each.`,
        issues:[],
        tips:[short
          ? 'Try expanding your answers with one or two supporting details.'
          : 'Try connecting your ideas with more varied sentence structures.']
      },
      clarity:{
        assessment:'Based on response length and structure only, since live AI analysis wasn\'t available.',
        tips:[]
      },
      confidence:{
        assessment:short
          ? `Your responses averaged around ${avgWords} words, on the shorter side.`
          : `Your responses averaged around ${avgWords} words, showing a willingness to elaborate.`,
        tips:[]
      },
      practice_plan:[short
        ? 'Next session, try adding one extra sentence with a reason or example each time you answer.'
        : 'Next session, try linking two ideas together with words like "because" or "which is why" to sound even more natural.']
    };

    fb.overall=Math.round(
      (
        fb.scores.fluency+
        fb.scores.grammar+
        fb.scores.vocabulary+
        fb.scores.clarity+
        fb.scores.confidence
      )/5
    );

    state.demoMode=true;
  }

  state.feedback=fb;
  state.loading=false;
  state.avatarState='idle';
  state.view='feedback';
  render();
}

// Validates and cleans the model's feedback JSON. Returns null if the core
// required parts (scores + summary + at least one strength + a practice
// plan) aren't present — this is what triggers the honest, non-hallucinating
// fallback above rather than showing malformed or invented feedback. Every
// optional sub-list defaults to [] rather than failing validation, since an
// empty list ("no genuine mistakes found") is a valid, expected result.
function sanitizeFeedback(fb){
  if(!fb||typeof fb!=='object')return null;

  const s=fb.scores;
  const scoreOk=k=>Number.isInteger(Number(s?.[k]))&&Number(s[k])>=0&&Number(s[k])<=100;
  if(!s||!['fluency','grammar','vocabulary','clarity','confidence'].every(scoreOk))return null;

  const scores={
    fluency:Number(s.fluency),
    grammar:Number(s.grammar),
    vocabulary:Number(s.vocabulary),
    clarity:Number(s.clarity),
    confidence:Number(s.confidence)
  };

  const overall_summary=typeof fb.overall_summary==='string'?fb.overall_summary.trim():'';

  const strList=(arr,max)=>Array.isArray(arr)
    ?arr.filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim()).slice(0,max)
    :[];

  const strengths=strList(fb.strengths,3);
  const practice_plan=strList(fb.practice_plan,3);

  if(!overall_summary||!strengths.length||!practice_plan.length)return null;

  const mistakeList=(arr,max)=>Array.isArray(arr)
    ?arr.filter(x=>x&&typeof x.original==='string'&&x.original.trim()&&typeof x.correction==='string'&&x.correction.trim()&&typeof x.explanation==='string'&&x.explanation.trim())
        .map(x=>({original:x.original.trim(),correction:x.correction.trim(),explanation:x.explanation.trim()}))
        .slice(0,max)
    :[];

  const suggestionList=(arr,max)=>Array.isArray(arr)
    ?arr.filter(x=>x&&typeof x.basic==='string'&&x.basic.trim()&&typeof x.better==='string'&&x.better.trim())
        .map(x=>({basic:x.basic.trim(),better:x.better.trim(),example:typeof x.example==='string'?x.example.trim():''}))
        .slice(0,max)
    :[];

  const assessmentOf=obj=>typeof obj?.assessment==='string'?obj.assessment.trim():'';

  return{
    overall_summary,
    scores,
    strengths,
    grammar:{
      mistakes:mistakeList(fb.grammar&&fb.grammar.mistakes,3),
      patterns:strList(fb.grammar&&fb.grammar.patterns,3)
    },
    vocabulary:{
      used_well:strList(fb.vocabulary&&fb.vocabulary.used_well,3),
      suggestions:suggestionList(fb.vocabulary&&fb.vocabulary.suggestions,3)
    },
    fluency:{
      assessment:assessmentOf(fb.fluency),
      issues:strList(fb.fluency&&fb.fluency.issues,3),
      tips:strList(fb.fluency&&fb.fluency.tips,3)
    },
    clarity:{
      assessment:assessmentOf(fb.clarity),
      tips:strList(fb.clarity&&fb.clarity.tips,3)
    },
    confidence:{
      assessment:assessmentOf(fb.confidence),
      tips:strList(fb.confidence&&fb.confidence.tips,3)
    },
    practice_plan
  };
}

function renderFeedback(){
  const f=state.feedback;

  const bulletBlock=(icon,title,items)=>!items.length?'':`<div class="fb-block"><h3>${icon} ${title}</h3><ul class="fb-list">${items.map(i=>`<li>${escapeHtml(i)}</li>`).join('')}</ul></div>`;

  // A compact, always-visible card for one skill's assessment + tips.

    if(!skill.assessment&&!skill.tips.length)return'';
    return `<div class="fb-block"><h3>${icon} ${title}</h3>${skill.assessment?`<p>${escapeHtml(skill.assessment)}</p>`:''}${skill.tips.length?`<ul class="fb-list" style="margin-top:8px">${skill.tips.map(t=>`<li>${escapeHtml(t)}</li>`).join('')}</ul>`:''}</div>`;
  };

  const mistakeCard=item=>`<div class="correction-card"><div class="corr-row"><span class="corr-tag orig">Original</span><span>${escapeHtml(item.original)}</span></div><div class="corr-row"><span class="corr-tag imp">Correction</span><span>${escapeHtml(item.correction)}</span></div><p class="corr-expl">${escapeHtml(item.explanation)}</p></div>`;
  const vocabCard=item=>`<div class="correction-card"><div class="corr-row"><span class="corr-tag orig">Instead of</span><span>${escapeHtml(item.basic)}</span></div><div class="corr-row"><span class="corr-tag imp">Try</span><span>${escapeHtml(item.better)}</span></div>${item.example?`<p class="corr-expl">${escapeHtml(item.example)}</p>`:''}</div>`;

  const grammarCount=f.grammar.mistakes.length+f.grammar.patterns.length;
  const grammarBody=`${f.grammar.mistakes.map(mistakeCard).join('')}${f.grammar.patterns.length?`<div><div class="corr-tag orig" style="display:inline-block;margin-bottom:6px">Repeated pattern</div><ul class="fb-list">${f.grammar.patterns.map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul></div>`:''}`;

  const vocabCount=f.vocabulary.used_well.length+f.vocabulary.suggestions.length;

  const detailsBlock=(icon,title,count,bodyHtml)=>!count?'':`<details class="fb-details"><summary>${icon} ${title} (${count})</summary><div class="fb-details-body">${bodyHtml}</div></details>`;

  app.innerHTML=`<div class="screen">${state.demoMode?`<div class="demo-banner">Demo Mode — this feedback used simulated scoring.</div>`:''}<div class="fb-hero"><div style="font-size:30px">🎉</div><h1>Great job!</h1><p style="color:#666B62;font-size:14.5px;max-width:52ch;margin:0 auto">${escapeHtml(f.overall_summary)}</p><div class="score-ring">${f.overall} / 100</div></div><div class="metrics">${metricCard('Fluency',f.scores.fluency)}${metricCard('Grammar',f.scores.grammar)}${metricCard('Vocabulary',f.scores.vocabulary)}${metricCard('Clarity',f.scores.clarity)}${metricCard('Confidence',f.scores.confidence)}</div>${bulletBlock('👍','What you did well',f.strengths)}${skillBlock('🌊','Fluency',f.fluency)}${skillBlock('🔍','Clarity',f.clarity)}${skillBlock('💪','Confidence',f.confidence)}${detailsBlock('📝','Grammar',grammarCount,grammarBody)}${detailsBlock('📚','Vocabulary',vocabCount,vocabBody)}${bulletBlock('🧭','What to practice next',f.practice_plan)}<div class="basis-note">Scores (0-100) and corrections are an AI-generated practice indicator based only on patterns in your actual responses this session — not pronunciation, accent, or any psychological or medical assessment. Confidence reflects observable things like response length and hesitation, not how you feel.</div><div style="display:flex;gap:10px;margin-top:24px;flex-wrap:wrap"><button class="btn-primary" onclick="goSurvey()">Give Feedback</button><button class="btn-secondary" onclick="goScenario()">Practice Again</button></div></div>`;
}
function metricCard(label,v){return `<div class="metric"><div class="label">${label}</div><div class="val">${v}/100</div><div class="bar"><div class="bar-fill" style="width:${v}%"></div></div></div>`}
function goSurvey(){state.view='survey';render()}
function renderSurvey(){app.innerHTML=`<div class="screen"><h2 style="font-size:22px;margin:0 0 4px">How was your session?</h2><p style="color:#666B62;font-size:14.5px">Your answers help us improve SpeakMate.</p><div style="margin-top:18px"><div style="font-weight:600;font-size:14px">How useful was this session?</div><div class="stars">${[1,2,3,4,5].map(i=>`<span class="${state.survey.stars>=i?'active':''}" onclick="setStars(${i})">★</span>`).join('')}</div></div><div><div style="font-weight:600;font-size:14px">Would you practice with SpeakMate again?</div><div class="radio-row">${['Yes','Maybe','No'].map(x=>`<button class="${state.survey.again===x?'sel':''}" onclick="setAgain('${x}')">${x}</button>`).join('')}</div></div><div><div style="font-weight:600;font-size:14px;margin-bottom:6px">What should we improve?</div><textarea class="survey-box" placeholder="Optional — tell us anything." oninput="state.survey.comment=this.value">${escapeHtml(state.survey.comment)}</textarea></div><button class="btn-primary" ${(!state.survey.stars||!state.survey.again)?'disabled':''} onclick="submitSurvey()">Submit</button></div>`}

function escapeHtml(str){const d=document.createElement('div');d.innerText=String(str??'');return d.innerHTML}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
